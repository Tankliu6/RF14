<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PF45 × RF14 攤位搜尋地圖</title>
<style>
:root{
  --ink:#1d2129; --muted:#6b7280; --line:#e5e0d6; --bg:#f6f2ea; --accent:#6a4cdb;
  --g1:#e4572e; --g1t:#fdebe5; --g2:#d98e04; --g2t:#fdf1d8; --g3:#d6336c; --g3t:#fbe4ec;
  --g4:#0f8b8d; --g4t:#dff2f1; --g5:#6a4cdb; --g5t:#ebe6fc; --hit:#ffe066;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px 10px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.brand{font-weight:800;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}
.seg{display:flex;background:#efebe3;border-radius:10px;padding:3px;flex:none}
.seg button{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:700;color:#57534e;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row2{display:flex;gap:8px}
.search{flex:1;position:relative}
.search input{width:100%;height:42px;border:1.5px solid #d6d0c4;border-radius:12px;padding:0 38px 0 38px;font-size:16px;
  background:#fff;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(106,76,219,.15)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;
  color:#9ca3af;font-size:18px;display:none}
.search.has .clr{display:block}
#starBtn{height:42px;min-width:54px;border-radius:12px;border:1.5px solid #d6d0c4;background:#fff;font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
#starBtn .s{color:#f59e0b;font-size:17px}

/* ---------- results panel ---------- */
#panel{position:fixed;left:0;right:0;z-index:19;background:#fff;border-bottom:1px solid var(--line);
  max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;box-shadow:0 10px 24px rgba(0,0,0,.10)}
#panel.show{display:block}
.ph{position:sticky;top:0;background:#faf8f4;padding:8px 14px;font-size:12.5px;color:var(--muted);font-weight:700;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph button{color:var(--accent);font-weight:800;font-size:12.5px}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f1ede6}
.item:active{background:#f6f3ff}
.item .code{flex:none;min-width:64px;text-align:center;font-weight:800;font-size:13px;border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums}
.item .nm{flex:1;font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
.item .nm mark{background:var(--hit);border-radius:3px;padding:0 1px}
.item .st{flex:none;width:36px;height:36px;font-size:20px;color:#d1d5db;border-radius:50%}
.item .st.on{color:#f59e0b}
.empty-msg{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.empty-msg button{color:var(--accent);font-weight:800}
.c-g1{background:var(--g1t);color:var(--g1)} .c-g2{background:var(--g2t);color:var(--g2)} .c-g3{background:var(--g3t);color:var(--g3)}
.c-g4{background:var(--g4t);color:var(--g4)} .c-g5{background:var(--g5t);color:var(--g5)}
.c-g6{background:#efe6d3;color:#8a6d3b} .c-g0{background:#eceff3;color:#4b5563}

/* ---------- viewport ---------- */
#vp{position:fixed;left:0;right:0;bottom:0;overflow:hidden;touch-action:none;background:var(--bg);cursor:grab}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage.anim{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;
  background:rgba(29,33,41,.86);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;
  white-space:nowrap;transition:opacity .4s;pointer-events:none}
#ctrl{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:16;display:flex;flex-direction:column;gap:8px}
#ctrl button{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.10);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
#ctrl button.fit{font-size:12px;font-weight:800}

/* ---------- sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:18px 18px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.16);padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.show{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#e5e7eb;margin:0 auto 12px}
#sheet .sc{display:inline-block;font-weight:900;font-size:15px;border-radius:7px;padding:3px 9px;margin-bottom:8px}
#sheet .sn{font-size:21px;font-weight:800;line-height:1.3;word-break:break-word;margin-bottom:6px}
#sheet .sd{font-size:13px;color:var(--muted);margin-bottom:14px}
#sheet .acts{display:flex;gap:10px}
#sheet .acts button{flex:1;height:46px;border-radius:12px;font-weight:800;font-size:15px}
#sStar{background:#fff7e6;color:#b45309;border:1.5px solid #fcd34d}
#sStar.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
#sClose{background:#f3f4f6}

/* ---------- map ---------- */
.map{padding:40px 44px 34px;width:max-content}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.mhead h1{font-size:54px;font-weight:900;letter-spacing:.5px;line-height:1.1}
.mhead h1 em{font-style:normal;color:var(--g5)}
.mhead .sub{font-size:24px;font-weight:700;margin-top:10px}
.mhead .sub span{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 12px;margin-right:10px}
.mhead .how{font-size:18px;color:#4b5563;text-align:right;line-height:1.6}
.hall{background:#fff;border:3px solid #3b3b3b;border-radius:6px;padding:26px 30px 30px;display:grid;
  grid-template-columns:max-content 128px;column-gap:26px;width:max-content}
.leftnote{grid-row:1/span 3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  color:var(--muted);font-size:19px;line-height:1.6;font-weight:700;border-right:2px dashed var(--line);padding-right:18px}
.arrowL{font-size:54px;line-height:1;color:#9ca3af}
.main{grid-column:1}
.wall{grid-column:2;grid-row:1;display:flex;flex-direction:column;justify-content:space-between;border-left:2px dashed var(--line);padding-left:16px}
.wall .grp{display:flex;flex-direction:column;gap:8px}
.wall .grp div,.corp div{border:2px solid #9ca3af;border-radius:8px;background:#fafafa;padding:10px 6px;text-align:center;font-size:17px;font-weight:700}
.wall .cap{font-size:14px;color:var(--muted);text-align:center}
.wwrap{position:relative;display:flex;gap:14px;margin:26px 0 30px}
.wlabel{width:58px;display:flex;align-items:center;justify-content:center;background:var(--g5);color:#fff;border-radius:10px;font-size:40px;font-weight:900}
.wgrid{flex:1;display:grid;grid-template-columns:repeat(26,1fr);border:2px solid var(--g5);border-radius:8px;overflow:hidden}
.wcell{background:#fff;border-right:1px solid #d8d0f5;padding:6px 6px 8px;min-height:92px;display:flex;flex-direction:column;gap:4px;grid-row:1}
.wcell:last-child{border-right:none}
.wcell .code{background:var(--g5t);color:var(--g5);font-weight:800;font-size:15px;border-radius:5px;padding:1px 6px;align-self:flex-start}
.wcell .name{font-size:15px;font-weight:600;line-height:1.25;word-break:break-word}
.exit{position:absolute;top:-8px;transform:translate(-50%,-100%);text-align:center;font-size:15px;font-weight:800;color:#b42318;line-height:1.25;background:#fff;padding:0 8px;white-space:nowrap}
.exit small{font-weight:600;color:var(--muted)}
.exitArrow{font-size:24px;line-height:1}
.row{display:flex;gap:38px;align-items:flex-start}
.col,.slot{width:364px;flex:none}
.slot.wide2{width:766px}
.colhead{height:64px;display:flex;align-items:center;justify-content:center}
.colhead span{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#fff}
.colhead .small{width:auto!important;height:auto!important;border-radius:6px!important;font-size:16px!important;background:#6b7280;padding:4px 12px}
.g1 .colhead span{background:var(--g1)} .g2 .colhead span{background:var(--g2)} .g3 .colhead span{background:var(--g3)} .g4 .colhead span{background:var(--g4)}
.grid{display:grid;grid-template-columns:1fr 1fr;border:2px solid #4b5563;border-radius:6px;overflow:hidden;background:#4b5563;gap:1px}
.cell{background:#fff;display:flex;align-items:center;gap:7px;padding:0 7px;overflow:hidden;position:relative}
.cell .code{flex:none;font-weight:800;font-size:13.5px;border-radius:5px;padding:2px 5px;font-variant-numeric:tabular-nums}
.cell .name{font-size:15.5px;font-weight:600;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cell.tall{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:4px 8px}
.cell.tall .name{font-size:17px;-webkit-line-clamp:3}
.cell.xtall .name{font-size:18px;-webkit-line-clamp:5}
.cell.long .name{font-size:12.5px;-webkit-line-clamp:3;line-height:1.12}
.cell.tall.long .name{font-size:15px;-webkit-line-clamp:4}
.cell.R{border-left:2px solid #4b5563}
.cell.none{background:#f3f4f6}
.cell.none .name{color:#9ca3af;font-weight:500;font-size:13px}
.cell.none .code{background:#e5e7eb!important;color:#9ca3af!important}
.g1 .code{background:var(--g1t);color:var(--g1)} .g2 .code{background:var(--g2t);color:var(--g2)}
.g3 .code{background:var(--g3t);color:var(--g3)} .g4 .code{background:var(--g4t);color:var(--g4)}
.block{display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;letter-spacing:6px;font-weight:800;writing-mode:vertical-rl}
.block.green{background:#8cc152} .block.orange{background:#e9772b}
.designer{height:884px;width:110px;margin:0 auto;border-radius:6px;font-size:32px}
.aisle{height:84px;margin:10px 0 6px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:20px;font-weight:800;letter-spacing:8px;
  background:repeating-linear-gradient(90deg,transparent 0 26px,#ece7de 26px 52px);background-size:100% 4px;background-repeat:no-repeat;background-position:center}
.aisle span{background:#fff;padding:0 18px}
.corp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.corp div{font-size:16px}
.lowernote{height:880px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--muted);font-size:19px;font-weight:700;line-height:1.7}
.bottom{grid-column:1;position:relative;height:150px;margin-top:14px;border-top:3px solid #3b3b3b}
.door{position:absolute;top:6px;transform:translateX(-50%);text-align:center;font-size:20px;font-weight:900;line-height:1.2;white-space:nowrap}
.door small{font-size:15px;font-weight:700;color:#4b5563}
.door .ar{font-size:26px;color:#b42318}
.walltag{position:absolute;top:8px;transform:translateX(-50%);font-size:15px;color:var(--muted);font-weight:700;border:2px solid #9ca3af;border-radius:6px;padding:2px 8px;background:#fafafa;white-space:nowrap}
.mfoot{margin-top:18px;font-size:16px;color:var(--muted)}

/* states */
.map.q .cell:not(.hit) > *, .map.q .wcell:not(.hit) > *{opacity:.22}
.map.q .cell:not(.hit), .map.q .wcell:not(.hit){background:#f7f5f1}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.cell.hit, .wcell.hit{background:var(--hit)!important;opacity:1!important}
.cell.focus, .wcell.focus{outline:5px solid var(--accent);outline-offset:-5px;z-index:2;animation:pulse 1.1s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(106,76,219,.0)}50%{box-shadow:inset 0 0 0 14px rgba(106,76,219,.35)}}
.starred::after{content:"★";position:absolute;right:4px;top:2px;font-size:17px;color:#f59e0b;text-shadow:0 0 2px #fff}
.wcell{position:relative}

/* ---- 開拓模型祭 & landmarks ---- */
.rfpanel,.ulpanel{position:relative;flex:none}
.rf-title{position:absolute;background:#8a6d3b;color:#fff;font-weight:900;font-size:22px;border-radius:8px;padding:6px 14px;white-space:nowrap}
.rf-desk{position:absolute;background:#fbe9c6;color:#8a6d3b;font-weight:800;font-size:17px;border-radius:6px;padding:10px 26px;white-space:nowrap}
.rf-lw{position:absolute;width:120px;background:#fbe9c6;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-size:20px;font-weight:800;color:#7c6136;writing-mode:vertical-rl;letter-spacing:4px}
.rf-lw svg{writing-mode:horizontal-tb}
.rf-comp{position:absolute;background:#eef6e4;border:3px solid #8cc152;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center}
.rf-comp b{display:block;font-size:46px;line-height:1.3;color:#3f6d1c;font-weight:900}
.rf-comp small{display:block;margin-top:14px;font-size:22px;color:#5f8a3a;font-weight:700}
.rf-letter{position:absolute;transform:translateX(-50%);width:52px;height:48px;border-radius:12px;background:#8a6d3b;color:#fff;font-size:30px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.rf-cell{position:absolute;border:2px solid #6b5a3e;margin-top:-2px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#3b3b3b;background:#fff}
.rf-cell.cb{background:#d8c8a6} .rf-cell.cu{background:#bcd9e4}
.rf-tag{position:absolute;transform:translateY(-50%);max-width:150px;font-size:16.5px;font-weight:800;line-height:1.15;padding:5px 8px;border-radius:7px;background:#fff;
  border:1.5px solid #e6dcc8;word-break:break-word}
.rf-tag.tb{color:#7c6136} .rf-tag.tt{color:#126b78;border-color:#cfe3e8}
.rf-bolt{position:absolute;transform:translateY(-50%)}
.rf-proto{position:absolute;background:#c9b48a;color:#fff;font-size:30px;font-weight:900;letter-spacing:6px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.rf-wb{position:absolute;border:2px solid #6b5a3e;background:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-left:-1px}
.rf-wb.v{align-items:flex-end;padding-bottom:6px}
.rf-pillar{position:absolute;height:40px;background:#1f1f1f}
.rf-wtag{position:absolute;transform:translateX(-50%);font-size:16.5px;font-weight:800;color:#7c6136;white-space:nowrap;padding:3px 8px;border-radius:6px;background:#fff}
.ul{position:absolute;border:2px solid #4b5563;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:800;color:#1f2937;padding:4px;line-height:1.2}
.ul.sm{font-size:18px} .ul.gray{background:#9a9a9a;color:#fff;border:none;font-size:30px;writing-mode:vertical-rl}
.ul.yellow{background:#f2d73a;border:none;font-size:34px} .ul.green{background:#8cc152;border:none;color:#fff;font-size:34px;writing-mode:vertical-rl}
.ul.orange{background:#e9772b;border:none;color:#fff;font-size:34px;writing-mode:vertical-rl;letter-spacing:8px}
.ul.big{font-size:64px;font-weight:900}
.ul-out{position:absolute;background:repeating-linear-gradient(45deg,#f1eee8 0 14px,#e7e2d8 14px 28px);color:#a8a29e;font-size:30px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border-right:3px solid #3b3b3b;border-bottom:3px solid #3b3b3b}
.corp div,.wall .grp div{position:relative}
.checkin{position:absolute;top:38px;transform:translateX(-50%);background:#e03131;color:#fff;font-weight:900;font-size:20px;padding:8px 18px;border-radius:4px}
.army{position:absolute;top:34px;height:62px;background:#f1ea6a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#3b3b3b}
.map.q [data-i]:not(.hit):not(.cell):not(.wcell){opacity:.3}
[data-i].hit{background:var(--hit)!important;opacity:1!important;color:#1d2129}
[data-i].focus{outline:5px solid var(--accent);outline-offset:-2px;z-index:3;animation:pulse 1.1s ease-in-out 3}
</style>
</head>
<body>
<div id="top">
  <div class="row1">
    <div class="brand">PF45 × RF14<small>攤位搜尋地圖</small></div>
    <div class="seg" id="seg">
      <button data-d="d1">首日 11/07</button>
      <button data-d="d2">次日 11/08</button>
    </div>
  </div>
  <div class="row2">
    <div class="search" id="sbox">
      <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="搜尋社團／廠商名或攤位號（如 B25）">
      <button class="clr" id="clr" aria-label="清除">✕</button>
    </div>
    <button id="starBtn" aria-label="收藏清單"><span class="s">★</span><span id="starN">0</span></button>
  </div>
</div>
<div id="panel"></div>
<div id="vp"><div id="stage"></div></div>
<div id="ctrl">
  <button id="zin" aria-label="放大">＋</button>
  <button id="zout" aria-label="縮小">－</button>
  <button id="zfit" class="fit" aria-label="全圖">全圖</button>
</div>
<div id="hint">搜尋社團／攤位號，或雙指縮放地圖</div>
<div id="sheet">
  <div class="grab"></div>
  <div class="sc" id="sCode"></div>
  <div class="sn" id="sName"></div>
  <div class="sd" id="sDay"></div>
  <div class="acts"><button id="sStar">☆ 加入收藏</button><button id="sClose">關閉</button></div>

const posUpper = n => n<=24 ? [2,25-n] : [1,n-24];

function dispW(s){ let w=0; for(const ch of s) w += ch.codePointAt(0)>0x2E80 ? 2 : 1; return w; }

function cellHTML(e, L, n, col, row, span){
  let cls='cell'+(span>=2?' tall':'')+(span>=3?' xtall':'')+(col===2?' R':' L');
  const st=`grid-column:${col};grid-row:${row}/span ${span}`;
  if(!e) return `<div class="${cls} none" style="${st}"><span class="code">${L}${pad(n)}</span><span class="name">（未列）</span></div>`;
  const w=dispW(e.name); if((span===1&&w>21)||(span===2&&w>40)) cls+=' long';
  return `<div class="${cls}" data-i="${e.i}" style="${st}"><span class="code">${e.label}</span><span class="name">${esc(e.name)}</span></div>`;
}
function column(d, L, lo, hi, posf, rows, extra=''){
  const at=DB[d].at, done=new Set(); let out='';
  for(let n=lo;n<=hi;n++){
    if(done.has(n)) continue;
    const e=at[L+n];
    if(e){ const ps=e.n.map(posf); const rs=ps.map(p=>p[1]).sort((a,b)=>a-b);
      out+=cellHTML(e,L,n,ps[0][0],rs[0],rs.length); e.n.forEach(x=>done.add(x)); }
    else { const p=posf(n); out+=cellHTML(null,L,n,p[0],p[1],1); done.add(n); }
  }
  return `<div class="col ${GROUP[L]}"><div class="colhead"><span>${L}</span></div><div class="grid" style="grid-template-rows:repeat(${rows},${ROW_H}px)">${out}${extra}</div></div>`;
}

function layout(){ const h=$('#top').offsetHeight; vp.style.top=h+'px'; panel.style.top=h+'px'; }
function apply(){ stage.style.transform=`translate(${tx}px,${ty}px) scale(${s})`; }
function mapSize(){ const m=$('#map'); return [m.offsetWidth, m.offsetHeight]; }
function fit(anim){
  const [W,H]=mapSize(), vw=vp.clientWidth, vh=vp.clientHeight;
  fitS=Math.min(vw/W, vh/H)*0.97; s=fitS; tx=(vw-W*s)/2; ty=Math.max(8,Math.min((vh-H*s)/2, 16));
  setAnim(anim); apply();
}
function setAnim(on){ stage.classList.toggle('anim', !!on); }
function clampS(v){ return Math.min(Math.max(v, fitS*0.8), 2.6); }
function zoomAt(px,py,k){ const ns=clampS(s*k); k=ns/s; tx=px-(px-tx)*k; ty=py-(py-ty)*k; s=ns; apply(); }

function refreshStars(){

  for(const i in cellsByI){ const e=DB[day].list[i]; cellsByI[i].classList.toggle('starred', isStar(day,e.key)); }

// ---- search ----
function search(d, raw){
  const q=norm(raw); if(!q) return [];
  const list=DB[d].list;
  let m=q.match(/^(模|rf)?([a-hm-tw])0*(\d{1,2})$/);
  if(m){ const c=m[2]+pad(+m[3]); const hit=list.filter(e=> m[1] ? e.codes.includes('模'+c) : e.codes.includes(c)); if(hit.length) return hit; }
  m=q.match(/^(模|rf)?([a-hm-tw])$/);
  if(m){ const L=m[2].toUpperCase(); return list.filter(e=>e.L===L && (m[1] ? !e.pf : true)); }
  return list.filter(e=>e.nn.includes(q) || norm(e.label).includes(q) || e.codes.includes(q));
}
function hl(name, raw){
  const q=norm(raw); if(!q) return esc(name);
  // map normalized positions back to original characters
  let map=[], nn='';
  [...name].forEach((ch,idx)=>{ const n=norm(ch); for(const c of n){ nn+=c; map.push(idx); } });
  const k=nn.indexOf(q); if(k<0) return esc(name);
  const chars=[...name], a=map[k], b=map[k+q.length-1];
  return esc(chars.slice(0,a).join(''))+'<mark>'+esc(chars.slice(a,b+1).join(''))+'</mark>'+esc(chars.slice(b+1).join(''));
}
function itemHTML(e, raw){
  const on=isStar(day,e.key);
  return `<div class="item" data-go="${e.i}"><span class="code c-${e.grp}">${e.label}</span><span class="nm">${hl(e.name,raw||'')}</span>`
       + `<button class="st${on?' on':''}" data-star="${e.i}" aria-label="收藏">${on?'★':'☆'}</button></div>`;
}
function clearMarks(){ stage.querySelectorAll('.hit').forEach(el=>el.classList.remove('hit')); $('#map')&&$('#map').classList.remove('q'); }
function runSearch(keepPanel){
  const raw=qEl.value; $('#sbox').classList.toggle('has', !!raw);
  clearMarks();
  if(!raw.trim()){ if(panel.dataset.mode!=='stars') hidePanel(); return; }
  const hits=search(day, raw);
  $('#map').classList.add('q');
  hits.forEach(e=>cellsByI[e.i]&&cellsByI[e.i].classList.add('hit'));
  panel.dataset.mode='search';
  let h=`<div class="ph"><span>${DAYS[day].full} 找到 ${hits.length} 筆</span></div>`;
  if(hits.length) h+=hits.slice(0,80).map(e=>itemHTML(e,raw)).join('') + (hits.length>80?`<div class="empty-msg">還有 ${hits.length-80} 筆，請輸入更完整的名稱</div>`:'');
  else { const other=day==='d1'?'d2':'d1', oh=search(other, raw).length;
    h+=`<div class="empty-msg">${DAYS[day].label}沒有符合「${esc(raw)}」的社團${oh?`<br><button data-switch="${other}">${DAYS[other].label}有 ${oh} 筆，切換過去看 →</button>`:''}</div>`; }
  panel.innerHTML=h; panel.classList.add('show');
  if(!keepPanel) panel.scrollTop=0;
}
function showStars(){
  const list=DB[day].list.filter(e=>isStar(day,e.key));
  panel.dataset.mode='stars';
  let h=`<div class="ph"><span>${DAYS[day].full} 我的收藏 ${list.length} 個</span><button data-closepanel>收起</button></div>`;
  h+= list.length ? list.map(e=>itemHTML(e,'')).join('')
      : `<div class="empty-msg">還沒有收藏。<br>點地圖上的攤位或搜尋結果旁的 ☆ 就能加入。</div>`;
  const other=day==='d1'?'d2':'d1';
  if(stars[other].length) h+=`<div class="empty-msg"><button data-switch="${other}">${DAYS[other].label}另有 ${stars[other].length} 個收藏 →</button></div>`;
  panel.innerHTML=h; panel.classList.add('show');
}
function hidePanel(){ panel.classList.remove('show'); panel.dataset.mode=''; }

// ---- focus ----
function focusEntry(i){
  const el=cellsByI[i]; if(!el) return;
  stage.querySelectorAll('.focus').forEach(x=>x.classList.remove('focus'));
  const sr=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
  const cx=(r.left-sr.left+r.width/2)/s, cy=(r.top-sr.top+r.height/2)/s;
  s=clampS(s<0.8 ? 0.8 : s);
  const vw=vp.clientWidth, vh=vp.clientHeight;
  tx=vw/2-cx*s; ty=vh*0.42-cy*s;
  setAnim(true); apply();
  void el.offsetWidth; el.classList.add('focus');
  openSheet(i);
}

// ---- sheet ----
let sheetI=null;
function openSheet(i){
  const e=DB[day].list[i]; sheetI=i;
  const sc=$('#sCode'); sc.textContent=e.label; sc.className='sc c-'+e.grp;
  $('#sName').textContent=e.name;
  $('#sDay').textContent=(e.pf?DAYS[day].full+'　·　':'')+e.area;
  syncSheetStar(); $('#sheet').classList.add('show');
}
function syncSheetStar(){ if(sheetI==null) return; const on=isStar(day,DB[day].list[sheetI].key); const b=$('#sStar'); b.classList.toggle('on',on); b.textContent=on?'★ 已收藏':'☆ 加入收藏'; }
function closeSheet(){ $('#sheet').classList.remove('show'); sheetI=null; }
$('#sStar').onclick=()=>{ if(sheetI==null) return; toggleStar(day, DB[day].list[sheetI].key); syncSheetStar(); };
$('#sClose').onclick=closeSheet;

// ---- events ----
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setDay(b.dataset.d));
let tmr; qEl.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(()=>runSearch(),90); hideHint(); });
qEl.addEventListener('focus',()=>{ if(qEl.value) runSearch(true); });
qEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const first=panel.querySelector('[data-go]'); if(first){ qEl.blur(); hidePanel(); focusEntry(first.dataset.go); } } });
$('#clr').onclick=()=>{ qEl.value=''; runSearch(); qEl.focus(); };
$('#starBtn').onclick=()=>{ if(panel.dataset.mode==='stars' && panel.classList.contains('show')) { hidePanel(); return; } qEl.blur(); showStars(); };
panel.addEventListener('click',e=>{
  const st=e.target.closest('[data-star]'); if(st){ e.stopPropagation(); toggleStar(day, DB[day].list[st.dataset.star].key); syncSheetStar(); return; }
  const sw=e.target.closest('[data-switch]'); if(sw){ setDay(sw.dataset.switch); if(panel.dataset.mode==='stars') showStars(); return; }
  if(e.target.closest('[data-closepanel]')){ hidePanel(); return; }
  const go=e.target.closest('[data-go]'); if(go){ qEl.blur(); hidePanel(); focusEntry(go.dataset.go); }
});
$('#zin').onclick=()=>{ setAnim(true); zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1.6); };
$('#zout').onclick=()=>{ setAnim(true); zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1/1.6); };
$('#zfit').onclick=()=>fit(true);

// pan / pinch / tap
const pts=new Map(); let tap=null;
function vpXY(e){ const r=vp.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
vp.addEventListener('pointerdown',e=>{
  try{ vp.setPointerCapture(e.pointerId); }catch(_){}
  pts.set(e.pointerId, vpXY(e)); setAnim(false);
  if(pts.size===1) tap={x:e.clientX,y:e.clientY,t:Date.now(),moved:false}; else if(tap) tap.moved=true;
  if(document.activeElement===qEl) qEl.blur();
  hideHint();
});
vp.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  const prev=[...pts.values()].map(p=>p.slice()); const old=pts.get(e.pointerId).slice();
  pts.set(e.pointerId, vpXY(e));
  if(pts.size===1){ const [x,y]=pts.get(e.pointerId); tx+=x-old[0]; ty+=y-old[1]; apply();
    if(tap && Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>7) tap.moved=true; }
  else if(pts.size===2){
    const now=[...pts.values()];
    const d0=Math.hypot(prev[0][0]-prev[1][0],prev[0][1]-prev[1][1]), d1=Math.hypot(now[0][0]-now[1][0],now[0][1]-now[1][1]);
    const m0=[(prev[0][0]+prev[1][0])/2,(prev[0][1]+prev[1][1])/2], m1=[(now[0][0]+now[1][0])/2,(now[0][1]+now[1][1])/2];
    tx+=m1[0]-m0[0]; ty+=m1[1]-m0[1]; if(d0>0) zoomAt(m1[0],m1[1],d1/d0); else apply();
  }
});
function endPtr(e){
  if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if(pts.size===0 && tap && !tap.moved && Date.now()-tap.t<600 && e.type==='pointerup'){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const c=el && el.closest('[data-i]');
    if(panel.classList.contains('show')) hidePanel();
    if(c){ stage.querySelectorAll('.focus').forEach(x=>x.classList.remove('focus')); c.classList.add('focus'); openSheet(c.dataset.i); }
    else closeSheet();
  }
  if(pts.size===0) tap=null;
}
vp.addEventListener('pointerup',endPtr); vp.addEventListener('pointercancel',endPtr);
vp.addEventListener('wheel',e=>{ e.preventDefault(); setAnim(false); const [x,y]=vpXY(e); zoomAt(x,y,Math.exp(-e.deltaY*0.0018)); },{passive:false});
// iOS Safari gesture events: prevent page zoom
document.addEventListener('gesturestart',e=>e.preventDefault());

let hintHidden=false; function hideHint(){ if(hintHidden) return; hintHidden=true; $('#hint').style.opacity=0; }
setTimeout(hideHint, 6000);
window.addEventListener('resize',()=>{ layout(); });

// ---- init ----
(function init(){
  let d=null; try{ d=localStorage.getItem('pf45rf14-day'); }catch(e){}
  if(location.hash==='#day2') d='d2'; else if(location.hash==='#day1') d='d1';
  if(d!=='d1' && d!=='d2'){ const now=new Date(); d = (now >= new Date('2026-11-08T00:00:00+08:00')) ? 'd2' : 'd1'; }
  day=d; layout(); render();
})();
</script>
</body>
